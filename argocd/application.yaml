apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meditriage-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/triageops-ts/triageops-gitops.git
    path: overlays/dev
    targetRevision: feature/argocd-setup
  destination:
    server: https://kubernetes.default.svc
    namespace: triageops-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true