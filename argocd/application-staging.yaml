apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meditriage-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/triageops-ts/triageops-gitops.git
    path: overlays/staging
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: triageops-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true