apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meditriage-backend-hpa
  labels:
    app: meditriage-backend
    part-of: meditriage
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meditriage-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
