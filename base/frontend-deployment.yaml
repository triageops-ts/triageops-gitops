apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditriage-frontend
  labels:
    app: meditriage-frontend
    part-of: meditriage
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meditriage-frontend
  template:
    metadata:
      labels:
        app: meditriage-frontend
        part-of: meditriage
        tier: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: meditriage-frontend
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
