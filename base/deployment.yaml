apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: meditriage-backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: meditriage
  strategy:
    canary:
      steps:
      - setWeight: 5
      - pause: {duration: 2m}
      - setWeight: 25
      - pause: {duration: 2m}
  template:
    metadata:
      labels:
        app: meditriage-backend
        part-of: meditriage
        tier: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: meditriage-backend@sha256:a835fc25f9b69177fe21f6d4b735a1be0f4afb80ddd8ea2c180c10c70f896dcc
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: meditriage-backend-config
            - secretRef:
                name: triageops-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3