apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meditriage-backend-ingress
spec:
  rules:
    - host: meditriage.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meditriage-backend
                port:
                  number: 80
