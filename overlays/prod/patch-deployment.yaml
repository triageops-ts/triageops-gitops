apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: meditriage-backend
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: backend
          image: meditriage-backend@sha256:a835fc25f9b69177fe21f6d4b735a1be0f4afb80ddd8ea2c180c10c70f896dcc
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
