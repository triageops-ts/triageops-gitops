
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: meditriage-backend
spec:
  replicas: 2
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
