apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meditriage-backend-ingress
spec:
  rules:
    - host: dev.meditriage.local
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: meditriage-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meditriage-frontend
                port:
                  number: 80
