apiVersion: batch/v1
kind: Job
metadata:
  name: meditriage-migrations
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: migrations
          image: meditriage-backend
          command:
            - python
            - -m
            - alembic
            - upgrade
            - head
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: triageops-migration-secrets
                  key: MIGRATION_DATABASE_URL
